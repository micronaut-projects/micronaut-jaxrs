plugins {
    id "io.micronaut.build.internal.parent"
}

repositories {
    mavenCentral()
}
configurations.configureEach {
    resolutionStrategy {
        preferProjectModules()
    }
}

allprojects {
    repositories {
        maven {
            url = "https://central.sonatype.com/repository/maven-snapshots/"
            mavenContent {
                snapshotsOnly()
            }
            content {
                includeGroupByRegex("io\\.micronaut.*")
            }
        }
        mavenCentral()
    }
}

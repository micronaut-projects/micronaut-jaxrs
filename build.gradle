plugins {
    id "io.micronaut.build.internal.parent"
}

def jakartaRestTckCoverageReport = layout.projectDirectory.file('tests/jaxrs-tck/build/reports/jacoco/test/jacocoTestReport.xml')
def jakartaRestTckSonarCoverageReport = layout.buildDirectory.file('reports/jacoco/jakartaRestTckSonar/jacocoTestReport.xml')
def jaxRsRuntimeCoverageProjects = [
    'micronaut-jaxrs-common',
    'micronaut-jaxrs-client',
    'micronaut-jaxrs-server',
    'micronaut-jaxrs-server-security',
    'micronaut-jaxrs-servlet',
    'micronaut-jaxrs-reflection',
    'micronaut-jaxrs-xml',
    'micronaut-jaxrs-jakarta'
] as Set
def jaxRsCoverageProjects = (jaxRsRuntimeCoverageProjects + ['micronaut-jaxrs-processor']) as Set
def jaxRsCoverageReports = jaxRsCoverageProjects.collectEntries { projectName ->
    [(projectName): project(":${projectName}").layout.buildDirectory.file('reports/jacoco/test/jacocoTestReport.xml')]
}
def sonarCoverageReports = jaxRsCoverageProjects.collectEntries { projectName ->
    [(projectName): layout.buildDirectory.file("reports/jacoco/sonar/${projectName}/jacocoTestReport.xml")]
}

def generateSonarCoverageReports = tasks.register('generateSonarCoverageReports') {
    inputs.files(jaxRsCoverageReports.values())
    inputs.file(jakartaRestTckCoverageReport)
    outputs.files(sonarCoverageReports.values())
    outputs.file(jakartaRestTckSonarCoverageReport)
    doLast {
        def sourcePackagePrefixesByProject = [:]
        jaxRsCoverageProjects.each { projectName ->
            def sourceRoot = project(":${projectName}").layout.projectDirectory.dir('src/main/java').asFile
            if (!sourceRoot.directory) {
                return
            }
            def sourceRootPath = sourceRoot.toPath()
            def sourceRootRelative = layout.projectDirectory.asFile.toPath().relativize(sourceRootPath).toString().replace(File.separatorChar, '/' as char)
            def sourcePackagePrefixes = [:]
            fileTree(sourceRoot) {
                include '**/*.java'
            }.each { File sourceFile ->
                def relativeSource = sourceRootPath.relativize(sourceFile.toPath()).toString().replace(File.separatorChar, '/' as char)
                def packageEnd = relativeSource.lastIndexOf('/')
                if (packageEnd > 0) {
                    def packageName = relativeSource.substring(0, packageEnd)
                    sourcePackagePrefixes.putIfAbsent(packageName, sourceRootRelative)
                }
            }
            sourcePackagePrefixesByProject[projectName] = sourcePackagePrefixes
        }

        def transformCoverageReport = { File inputFile, File outputFile, Map sourcePackagePrefixes ->
            if (!inputFile.exists()) {
                return
            }
            def packagePattern = ~/(?s)<package name="([^"]+)">(.*?)<\/package>/
            def matcher = packagePattern.matcher(inputFile.text)
            def transformed = new StringBuffer()
            while (matcher.find()) {
                def packageName = matcher.group(1)
                def packageBody = matcher.group(2)
                def sourcePrefix = sourcePackagePrefixes[packageName]
                if (sourcePrefix == null) {
                    matcher.appendReplacement(transformed, '')
                } else {
                    matcher.appendReplacement(
                        transformed,
                        java.util.regex.Matcher.quoteReplacement("<package name=\"${sourcePrefix}/${packageName}\">${packageBody}</package>".toString())
                    )
                }
            }
            matcher.appendTail(transformed)
            outputFile.parentFile.mkdirs()
            outputFile.text = transformed.toString()
        }

        jaxRsCoverageReports.each { projectName, report ->
            transformCoverageReport(
                report.get().asFile,
                sonarCoverageReports[projectName].get().asFile,
                sourcePackagePrefixesByProject[projectName]
            )
        }

        def runtimeSourcePackagePrefixes = [:]
        jaxRsRuntimeCoverageProjects.each { projectName ->
            runtimeSourcePackagePrefixes.putAll(sourcePackagePrefixesByProject[projectName])
        }
        transformCoverageReport(
            jakartaRestTckCoverageReport.asFile,
            jakartaRestTckSonarCoverageReport.get().asFile,
            runtimeSourcePackagePrefixes
        )
    }
}

plugins.withId('org.sonarqube') {
    tasks.named('sonar') {
        dependsOn(generateSonarCoverageReports)
    }
    sonar {
        properties {
            def coverageReports = sonarCoverageReports.values().collect { it.get().asFile.absolutePath }
            coverageReports.add(jakartaRestTckSonarCoverageReport.get().asFile.absolutePath)
            property 'sonar.coverage.jacoco.xmlReportPaths', coverageReports.join(',')
            property 'sonar.coverage.exclusions', [
                'tests/jaxrs-tck/src/main/java/**'
            ].join(',')
            property 'sonar.issue.ignore.multicriteria', [
                'jaxrsNullMarked',
                'jaxrsNullableOverride',
                'jaxrsSpecBranches',
                'jaxrsSpecEmptyMethods',
                'jaxrsArrayRecords',
                'jaxrsComplexity',
                'jaxrsVolatileDelegates',
                'jaxrsWildcardApis',
                'jaxrsProviderReturns',
                'jaxrsSpecLiterals',
                'jaxrsTestStateReset',
                'jaxrsTestStubs'
            ].join(',')
            property 'sonar.issue.ignore.multicriteria.jaxrsNullMarked.ruleKey', 'java:S2637'
            property 'sonar.issue.ignore.multicriteria.jaxrsNullMarked.resourceKey', '**/src/main/java/**'
            property 'sonar.issue.ignore.multicriteria.jaxrsNullableOverride.ruleKey', 'java:S2638'
            property 'sonar.issue.ignore.multicriteria.jaxrsNullableOverride.resourceKey', '**/src/main/java/**'
            property 'sonar.issue.ignore.multicriteria.jaxrsSpecBranches.ruleKey', 'java:S2583'
            property 'sonar.issue.ignore.multicriteria.jaxrsSpecBranches.resourceKey', '**/src/main/java/**'
            property 'sonar.issue.ignore.multicriteria.jaxrsSpecEmptyMethods.ruleKey', 'java:S1186'
            property 'sonar.issue.ignore.multicriteria.jaxrsSpecEmptyMethods.resourceKey', '**/src/main/java/**'
            property 'sonar.issue.ignore.multicriteria.jaxrsArrayRecords.ruleKey', 'java:S6218'
            property 'sonar.issue.ignore.multicriteria.jaxrsArrayRecords.resourceKey', '**/src/main/java/**'
            property 'sonar.issue.ignore.multicriteria.jaxrsComplexity.ruleKey', 'java:S3776'
            property 'sonar.issue.ignore.multicriteria.jaxrsComplexity.resourceKey', '**/src/main/java/**'
            property 'sonar.issue.ignore.multicriteria.jaxrsVolatileDelegates.ruleKey', 'java:S3077'
            property 'sonar.issue.ignore.multicriteria.jaxrsVolatileDelegates.resourceKey', '**/src/main/java/**'
            property 'sonar.issue.ignore.multicriteria.jaxrsWildcardApis.ruleKey', 'java:S1452'
            property 'sonar.issue.ignore.multicriteria.jaxrsWildcardApis.resourceKey', '**/src/main/java/**'
            property 'sonar.issue.ignore.multicriteria.jaxrsProviderReturns.ruleKey', 'java:S1751'
            property 'sonar.issue.ignore.multicriteria.jaxrsProviderReturns.resourceKey', '**/src/main/java/**'
            property 'sonar.issue.ignore.multicriteria.jaxrsSpecLiterals.ruleKey', 'java:S1192'
            property 'sonar.issue.ignore.multicriteria.jaxrsSpecLiterals.resourceKey', '**/src/main/java/**'
            property 'sonar.issue.ignore.multicriteria.jaxrsTestStateReset.ruleKey', 'java:S2093'
            property 'sonar.issue.ignore.multicriteria.jaxrsTestStateReset.resourceKey', '**/src/test/java/**'
            property 'sonar.issue.ignore.multicriteria.jaxrsTestStubs.ruleKey', 'java:S1186'
            property 'sonar.issue.ignore.multicriteria.jaxrsTestStubs.resourceKey', '**/src/test/java/**'
        }
    }
}

repositories {
    mavenCentral()
}
configurations.configureEach {
    resolutionStrategy {
        preferProjectModules()
    }
}

plugins {
    id "io.micronaut.build.internal.parent"
}

repositories {
    mavenCentral()
}
configurations.configureEach {
    resolutionStrategy {
        preferProjectModules()
    }
}

allprojects {
    repositories {
        mavenLocal {
            content {
                includeVersionByRegex("io\\.micronaut.*", ".*", ".*-fnroutes-SNAPSHOT")
            }
        }
        mavenCentral()
    }
}

plugins {
    id "java-library"
    id "io.micronaut.build.internal.jaxrs-base"
}

repositories {
    mavenCentral()
}

dependencies {
    implementation mn.micronaut.inject.java
    implementation mn.micronaut.inject
    implementation mn.micronaut.aop
    implementation mn.micronaut.context
    implementation mn.micronaut.http.server.netty
    implementation mn.micronaut.jackson.databind

    implementation projects.micronautJaxrsServer
    // the TCK deploys classes the annotation processors never saw: they need reflection
    implementation mn.micronaut.reflection
    // the security of the deployments with a login configuration
    implementation projects.micronautJaxrsServerSecurity
    implementation mnSecurity.micronaut.security
    implementation projects.micronautJaxrsClient
    implementation projects.micronautJaxrsStandardProviders
    implementation projects.micronautJaxrsProcessor
    implementation libs.jakarta.jaxrs.tck.tests
    implementation mnLogging.slf4j.jul.to.slf4j
    // the deployments that inject a servlet request get the stub of the server
    implementation mnServlet.servlet.api

    // the JSON-B implementation of the standard providers
    runtimeOnly libs.yasson
    runtimeOnly(mnLogging.logback.classic)

    testImplementation mnTest.junit.jupiter.api
    testImplementation libs.junit.platform.suite.engine
    testImplementation(libs.jakarta.jaxrs.tck.tests) {
        artifact {
            classifier = "sources"
        }
    }

    // the signature test of the JAX-RS API
    testRuntimeOnly libs.jakarta.sigtest
    testRuntimeOnly mnLogging.logback.classic
    testRuntimeOnly mnTest.junit.jupiter.engine
}

// the TCK with the micronaut-reflection module (test) and without it (testWithoutReflection)
def jaxrsApi = configurations.testRuntimeClasspath.incoming.artifactView { lenient(true) }.files.filter { it.name.startsWith("jakarta.ws.rs-api") }
tasks.withType(Test).configureEach {
    scanForTestClasses false
    systemProperty("junit.jupiter.extensions.autodetection.enabled", "true")
    // the tests the TCK disables pass as well
    systemProperty("junit.jupiter.conditions.deactivate", "org.junit.*DisabledCondition")
    systemProperty("java.util.logging.config.class", "x.LoggingConfig")
    systemProperty("webServerHost", "localhost")
    systemProperty("webServerPort", "8123")
    // the users of the security tests, see TckDeployableContainer
    systemProperty("user", "javajoe")
    systemProperty("password", "javajoe")
    systemProperty("authuser", "j2ee")
    systemProperty("authpassword", "j2ee")
    // the signature test: the API under test, and the classes of the JDK it extracts
    systemProperty("jimage.dir", layout.buildDirectory.dir("jimage").get().asFile.absolutePath)
    doFirst {
        systemProperty("signature.sigTestClasspath", jaxrsApi.asPath + File.pathSeparator + layout.buildDirectory.dir("jimage/java.base").get().asFile.absolutePath)
    }
    useJUnitPlatform()
    maxParallelForks = Runtime.runtime.availableProcessors().intdiv(2) ?: 1
}

// the TCK compiled from its sources with the annotation processors, so that the classes the
// deployments do not contain (the clients, their providers and the common library) get their metadata
configurations {
    tckSources {
        canBeConsumed = false
        transitive = false
    }
}
dependencies {
    tckSources(libs.jakarta.jaxrs.tck.tests) {
        artifact {
            classifier = "sources"
        }
    }
}
def extractTckSources = tasks.register("extractTckSources", Sync) {
    from({ zipTree(configurations.tckSources.singleFile) }) {
        include "**/*.java"
    }
    into(layout.buildDirectory.dir("tck-sources"))
}
sourceSets {
    tck {
        java.srcDir(extractTckSources)
        compileClasspath += sourceSets.main.compileClasspath
    }
}
dependencies {
    tckAnnotationProcessor mn.micronaut.inject.java
    tckAnnotationProcessor projects.micronautJaxrsProcessor
    tckAnnotationProcessor files(sourceSets.main.output)
}
def isTckJar = { File f -> f.name ==~ /jakarta-restful-ws-tck-[0-9.]+\.jar/ }
tasks.named("compileTckJava", JavaCompile) {
    options.compilerArgs.add("-parameters")
    // a deployment gets its beans from its own compilation only
    doLast {
        delete(fileTree(destinationDirectory) { include "META-INF/micronaut/io.micronaut.inject.BeanDefinitionReference/**" })
    }
}
// the TCK jar with its classes replaced by the processed ones, keeping its other resources
def processedTckJar = tasks.register("processedTckJar", Jar) {
    archiveFileName = "jakarta-restful-ws-tck-processed.jar"
    destinationDirectory = layout.buildDirectory.dir("tck-processed")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(sourceSets.tck.output)
    from({ zipTree(configurations.testRuntimeClasspath.find(isTckJar)) })
}

// only the generated metadata is used
def testWithoutReflection = tasks.register("testWithoutReflection", Test) {
    description = "Runs the TCK without the micronaut-reflection module on the classpath."
    group = "verification"
    def test = tasks.named("test", Test).get()
    testClassesDirs = test.testClassesDirs
    dependsOn(processedTckJar)
    classpath = files(processedTckJar) + test.classpath.filter { !it.name.startsWith("micronaut-reflection") && !isTckJar(it) }
    systemProperty("micronaut.jaxrs.test.reflection", "false")
}

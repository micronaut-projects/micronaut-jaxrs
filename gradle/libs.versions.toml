[versions]
managed-jaxrs-api = "4.0.0"
micronaut = "5.3.0-fnroutes-SNAPSHOT"
micronaut-security = "5.3.2"
micronaut-serde = "3.1.1"
micronaut-logging = "2.0.0"
micronaut-servlet = "6.1.0"
micronaut-validation = "5.1.0"
micronaut-reactor = "4.1.0"
jakarta-jaxrs-tck = "4.0.1"
jakarta-activation-api = "2.1.4"
jakarta-xml-bind-api = "4.0.5"
jaxb-runtime = "4.0.9"
angus-activation = "2.0.3"
errorprone-gradle-plugin = "5.1.1"
errorprone-no-reflection = "1.0.1"
error-prone-core = "2.50.0"
nullaway = "0.13.8"
# the version of the sourcegen model micronaut-core-processor is built with
micronaut-sourcegen = "2.1.0"

[libraries]
micronaut-core = { module = 'io.micronaut:micronaut-core-bom', version.ref = 'micronaut' }
micronaut-reactor = { module = 'io.micronaut.reactor:micronaut-reactor-bom', version.ref = 'micronaut-reactor' }
micronaut-security = { module = "io.micronaut.security:micronaut-security-bom", version.ref = "micronaut-security" }
micronaut-serde = { module = "io.micronaut.serde:micronaut-serde-bom", version.ref = "micronaut-serde" }
micronaut-servlet = { module = "io.micronaut.servlet:micronaut-servlet-bom", version.ref = "micronaut-servlet" }
micronaut-validation = { module = "io.micronaut.validation:micronaut-validation-bom", version.ref = "micronaut-validation" }

micronaut-sourcegen-annotations = { module = "io.micronaut.sourcegen:micronaut-sourcegen-annotations", version.ref = "micronaut-sourcegen" }
micronaut-sourcegen-generator = { module = "io.micronaut.sourcegen:micronaut-sourcegen-generator", version.ref = "micronaut-sourcegen" }
micronaut-sourcegen-generator-java = { module = "io.micronaut.sourcegen:micronaut-sourcegen-generator-java", version.ref = "micronaut-sourcegen" }

managed-jaxrs-api = { module = "jakarta.ws.rs:jakarta.ws.rs-api", version.ref = "managed-jaxrs-api" }

jakarta-activation-api = { module = "jakarta.activation:jakarta.activation-api", version.ref = "jakarta-activation-api" }
jakarta-xml-bind-api = { module = "jakarta.xml.bind:jakarta.xml.bind-api", version.ref = "jakarta-xml-bind-api" }
jaxb-runtime = { module = "org.glassfish.jaxb:jaxb-runtime", version.ref = "jaxb-runtime" }
angus-activation = { module = "org.eclipse.angus:angus-activation", version.ref = "angus-activation" }

nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
error-prone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "error-prone-core" }
gradle-errorprone = { module = "net.ltgt.errorprone:net.ltgt.errorprone.gradle.plugin", version.ref = "errorprone-gradle-plugin" }
gradle-errorprone-no-reflection = { module = "io.micronaut.errorprone:micronaut-errorprone-no-reflection-gradle-plugin", version.ref = "errorprone-no-reflection" }

junit-platform-suite-engine = { module = "org.junit.platform:junit-platform-suite-engine" }
jakarta-jaxrs-tck-tests = { module = 'jakarta.ws.rs:jakarta-restful-ws-tck', version.ref = "jakarta-jaxrs-tck" }
